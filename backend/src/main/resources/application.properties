# ─────────────────────────────────────────────────────────────────────────────
# GrowX Backend — Base Application Properties
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=growx-backend
spring.profiles.active=dev

server.port=8080
server.servlet.context-path=/

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ── Multipart Upload ───────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── JWT ───────────────────────────────────────────────────────────────────────
growx.jwt.secret=${GROWX_JWT_SECRET:CHANGE_ME_replace_this_with_a_secure_256_bit_secret_key_before_production}
growx.jwt.expiration-ms=86400000

# ── File Storage ───────────────────────────────────────────────────────────────
growx.storage.upload-dir=uploads

# ── Agro Weather Intelligence V2 ──────────────────────────────────────────────
# Open-Meteo does not require an API key for its standard non-commercial endpoint.
# All provider calls happen from Spring Boot; React never calls the provider directly.
growx.weather.base-url=${GROWX_WEATHER_BASE_URL:https://api.open-meteo.com/v1/forecast}
growx.weather.geocoding-url=${GROWX_WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
growx.weather.connection-timeout-ms=${GROWX_WEATHER_CONNECT_TIMEOUT_MS:3000}
growx.weather.read-timeout-ms=${GROWX_WEATHER_READ_TIMEOUT_MS:5000}
growx.weather.retry-count=${GROWX_WEATHER_RETRY_COUNT:1}
growx.weather.cache-ttl-minutes=${GROWX_WEATHER_CACHE_TTL_MINUTES:10}
growx.weather.stale-after-minutes=${GROWX_WEATHER_STALE_AFTER_MINUTES:60}
growx.weather.min-refresh-interval-seconds=${GROWX_WEATHER_MIN_REFRESH_SECONDS:60}

# ── Python AI Services ─────────────────────────────────────────────────────────
growx.ml.crop-service-url=${GROWX_CROP_ML_URL:http://localhost:5001}
growx.ml.disease-service-url=${GROWX_DISEASE_ML_URL:http://localhost:5002}
