# ─────────────────────────────────────────────────────────────────────────────
# GrowX Backend Test Profile
# Used by GrowXApplicationTests to load context without a real MySQL database.
# ─────────────────────────────────────────────────────────────────────────────

# Use H2 in-memory database for tests so no MySQL is needed
# NON_KEYWORDS prevents H2 from choking on MySQL-specific syntax
spring.datasource.url=jdbc:h2:mem:growx_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# JWT — test secret (not a real secret)
growx.jwt.secret=test_secret_key_that_is_exactly_32_chars_ok
growx.jwt.expiration-ms=3600000

# CORS — not needed for tests
growx.cors.allowed-origins=http://localhost:3000

# Storage — temp directory for tests
growx.storage.upload-dir=${java.io.tmpdir}/growx-test-uploads

logging.level.com.growx=WARN
