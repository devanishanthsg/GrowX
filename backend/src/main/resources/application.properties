# ─────────────────────────────────────────────────────────────────────────────
# GrowX Backend — Base Application Properties
# Profile-specific overrides live in application-dev.properties and
# application-prod.properties
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=growx-backend

# Active profile — override with environment variable: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ── Multipart Upload (Disease Detection images) ───────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ── GrowX JWT Configuration ───────────────────────────────────────────────────
# Secret must be at least 256 bits (32 characters). Set via environment variable.
# NEVER commit the actual secret to version control.
growx.jwt.secret=${GROWX_JWT_SECRET:CHANGE_ME_replace_this_with_a_secure_256_bit_secret_key_before_production}
growx.jwt.expiration-ms=86400000

# ── GrowX File Storage ────────────────────────────────────────────────────────
growx.storage.upload-dir=uploads

# ── External API Keys (set via environment variables — NEVER hardcode) ────────
growx.weather.api-key=${GROWX_WEATHER_API_KEY:}
growx.weather.base-url=https://api.openweathermap.org/data/2.5

growx.ml.crop-service-url=${GROWX_CROP_ML_URL:http://localhost:5001}
growx.ml.disease-service-url=${GROWX_DISEASE_ML_URL:http://localhost:5002}
