# ─────────────────────────────────────────────────────────────────────────────
# GrowX Backend — Development Profile
# Activated when: spring.profiles.active=dev
# ─────────────────────────────────────────────────────────────────────────────

# ── MySQL Database ────────────────────────────────────────────────────────────
# Replace the values below with your local MySQL credentials.
# Alternatively, set environment variables to avoid editing this file:
#   GROWX_DB_NAME, GROWX_DB_USER, GROWX_DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/${GROWX_DB_NAME:growx_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${GROWX_DB_USER:root}
spring.datasource.password=${GROWX_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA DDL ───────────────────────────────────────────────────────────────────
# "update" auto-creates/updates tables from entities — fine for development.
# Change to "validate" or "none" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── CORS — Vite Development Server ────────────────────────────────────────────
# Allows the frontend running on localhost:5173 to call this API.
growx.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── DevTools ──────────────────────────────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.growx=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# GrowX Python AI Service
growx.ml.crop-url=${GROWX_CROP_ML_URL:http://localhost:8000/predict/crop}