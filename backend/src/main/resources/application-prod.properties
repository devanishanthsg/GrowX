# ─────────────────────────────────────────────────────────────────────────────
# GrowX Backend — Production Profile
# Activated when: SPRING_PROFILES_ACTIVE=prod
#
# ALL values must be provided through environment variables.
# DO NOT hardcode any credentials in this file.
# ─────────────────────────────────────────────────────────────────────────────

# ── MySQL Database ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${GROWX_DB_HOST}:${GROWX_DB_PORT:3306}/${GROWX_DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${GROWX_DB_USER}
spring.datasource.password=${GROWX_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool ───────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ── JPA DDL ───────────────────────────────────────────────────────────────────
# Never use "update" or "create" in production — use database migrations instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── CORS — Production Frontend Origin ─────────────────────────────────────────
# Set to your actual deployed frontend domain.
growx.cors.allowed-origins=${GROWX_FRONTEND_URL}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.growx=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Server ────────────────────────────────────────────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
